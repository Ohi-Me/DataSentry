name: quality-gates

# The gate that makes this project what it claims to be: a change that
# regresses detection or reasoning quality cannot merge. Most projects test
# that the code runs. This tests that it is still right.

on:
  pull_request:
    paths:
      - "packages/datasentry_detectors/**"
      - "packages/datasentry_lineage/**"
      - "packages/datasentry_agent/**"
      - "services/correlator/**"
      - "tools/faultgen/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly chaos run

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"

      - name: Score against ground truth
        run: python ds.py eval --seeds 3 --tables 80 | tee eval.txt

      - name: Post the gate table on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('eval.txt', 'utf8');
            const clean = raw.split('\n')
              .map(line => line.replace(/\[[0-9;]*m/g, ''))
              .join('\n');
            const body = [
              '### DataSentry quality gates',
              '',
              '```',
              clean,
              '```',
              '',
              'Blocking gates: decoy FPR, root-asset accuracy, hallucination rate,',
              'cost per incident. The rest are tracked in `BENCHMARKS.md` -- the',
              'trend across runs is the artefact, not any single number.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/

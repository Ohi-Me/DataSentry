# The production-shaped local stack.
#
# DataSentry does not need any of this to run -- `py ds.py demo` uses an
# embedded control plane and an in-process event log, which is the whole point
# of the local design. This file is here for the path where you want the real
# backing services: Postgres instead of SQLite, Redpanda speaking the Kafka
# API, MinIO for the lake, and Grafana over Prometheus.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#   DS_DB_URL=postgresql://datasentry:datasentry@localhost:5432/datasentry py ds.py serve

name: datasentry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datasentry
      POSTGRES_PASSWORD: datasentry
      POSTGRES_DB: datasentry
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasentry"]
      interval: 5s
      retries: 12

  redpanda:
    # Kafka API and Schema Registry in one binary. Identical API to the
    # managed brokers, which is ADR-011: do not pay for a cluster during
    # development.
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092", "8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 8s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: datasentry
      MINIO_ROOT_PASSWORD: datasentry
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  miniodata:
